name: Release iOS to TestFlight
# Manual trigger only: Actions tab > "Release iOS to TestFlight" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit the finished build to TestFlight / App Store Connect"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build (production profile) on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ inputs.submit }}" = "true" ]; then
            eas build --platform ios --profile production --non-interactive --auto-submit
          else
            eas build --platform ios --profile production --non-interactive
          fi
