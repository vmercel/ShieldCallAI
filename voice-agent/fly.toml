app = "shieldcall-ghost-voice"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Worker process: keeps one Machine running. Scale to more Machines for
# concurrent screened calls.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["http", "tls"]
